[project]
name = "nano-openclaw"
version = "0.0.19"
description = "Minimal Python reimplementation of OpenClaw's agent loop, for learning."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "caft", email = "caft0505@gmail.com" }]
requires-python = ">=3.10"
keywords = ["llm", "agent", "claude", "openai", "anthropic", "tui", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "rich>=13.7",
    "Pillow>=10.0",
    "json5>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "mcp>=1.0.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "readability-lxml>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=14",
    "cryptography>=42.0",
    "qrcode>=7.0",
]

[project.urls]
Homepage = "https://github.com/caftxx/nano-openclaw"
Repository = "https://github.com/caftxx/nano-openclaw"
Issues = "https://github.com/caftxx/nano-openclaw/issues"

[project.scripts]
nano-openclaw = "nano_openclaw.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano_openclaw"]

[tool.hatch.build.targets.wheel.force-include]
".nano-openclaw-dev" = "nano_openclaw/_template"

[tool.hatch.build.targets.sdist]
include = [
    "nano_openclaw/",
    ".nano-openclaw-dev/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
