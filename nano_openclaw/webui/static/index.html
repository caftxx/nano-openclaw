<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nano-openclaw</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260505-thinking-left" />
  </head>
  <body>
    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

    <div class="shell">
      <aside id="sessionDrawer" class="sidebar drawer-panel" aria-label="Sessions" aria-hidden="true">
        <div class="brand">
          <div>
            <h1>nano-openclaw</h1>
            <p id="modelLabel">connecting</p>
          </div>
          <div class="brand-actions">
            <button id="newSessionBtn" class="icon-btn" title="New session" aria-label="New session">+</button>
            <button id="closeSessionDrawerBtn" class="icon-btn mobile-only" title="Close sessions" aria-label="Close sessions">×</button>
          </div>
        </div>
        <input id="sessionSearch" class="search" placeholder="Search sessions" />
        <div id="sessionList" class="session-list"></div>
      </aside>

      <main class="conversation">
        <header class="topbar">
          <button id="openSessionDrawerBtn" class="topbar-icon mobile-only" type="button" title="Sessions" aria-label="Open sessions">☰</button>
          <div class="topbar-title">
            <button id="thinkingToggle" class="thinking-toggle" type="button" aria-pressed="false">Thinking</button>
          </div>
          <div class="actions">
            <button id="openInspectorBtn" class="topbar-icon mobile-only status-button" type="button" title="Runtime" aria-label="Open runtime panel">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="approval-badge" hidden>0</span>
            </button>
          </div>
        </header>

        <section id="messages" class="messages"></section>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="Ask nano-openclaw"></textarea>
          <button id="sendBtn" type="submit" title="Send">↑</button>
        </form>
      </main>

      <aside id="inspectorDrawer" class="inspector drawer-panel" aria-label="Runtime and approvals" aria-hidden="true">
        <div class="inspector-header mobile-only">
          <div>
            <h2>Activity</h2>
            <p>Approvals, events, and runtime</p>
          </div>
          <button id="closeInspectorBtn" class="icon-btn" title="Close activity" aria-label="Close activity">×</button>
        </div>
        <section class="panel approval-panel">
          <h2>Approvals</h2>
          <div id="approvals" class="empty">No pending approvals</div>
        </section>
        <section class="panel events-panel">
          <h2>Turn Events</h2>
          <div id="events" class="event-list"></div>
        </section>
        <section class="panel">
          <h2>Runtime</h2>
          <div id="runtimeInfo" class="runtime-info"></div>
        </section>
      </aside>
    </div>

    <div id="tokenDialog" class="token-dialog hidden">
      <div class="token-box">
        <h2>Access token</h2>
        <p>Enter the token passed to <code>nano-openclaw web --token</code>.</p>
        <input id="tokenInput" type="password" autocomplete="current-password" />
        <button id="tokenSave">Connect</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="/static/app.js?v=20260505-thinking-left"></script>
  </body>
</html>
