<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nano-openclaw</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
    <script>
      (() => {
        const preference = localStorage.getItem("nanoOpenClawTheme") || "system";
        const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = preference === "dark" || (preference === "system" && systemDark) ? "dark" : "light";
        document.documentElement.dataset.themePreference = ["system", "dark", "light"].includes(preference) ? preference : "system";
      })();
    </script>
    <link rel="stylesheet" href="/static/styles.css?v=20260506-unified-drawers" />
  </head>
  <body>
    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

    <div class="shell">
      <aside id="sessionDrawer" class="sidebar drawer-panel" aria-label="Sessions" aria-hidden="true">
        <div class="brand">
          <div>
            <h1>nano-openclaw</h1>
          </div>
          <div class="brand-actions">
            <button id="closeSessionDrawerBtn" class="icon-btn" title="Close sessions" aria-label="Close sessions">×</button>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="Primary">
          <button type="button" id="newSessionNavBtn" class="nav-item">✎ <span>New chat</span></button>
        </nav>
        <div class="sidebar-section-label">Recent</div>
        <input id="sessionSearch" class="search" placeholder="Search sessions" />
        <div id="sessionList" class="session-list"></div>
      </aside>

      <main id="conversationRoot" class="conversation">
        <header class="topbar">
          <button id="openSessionDrawerBtn" class="topbar-icon" type="button" title="Sessions" aria-label="Toggle sessions">☰</button>
          <div class="topbar-title">
            <button id="thinkingToggle" class="thinking-toggle" type="button" aria-pressed="false">Thinking</button>
          </div>
          <div class="actions">
            <div class="appearance-menu">
              <button id="appearanceBtn" class="topbar-icon tool-icon" type="button" title="Theme" aria-label="Theme settings" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="4"></circle>
                  <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
                </svg>
              </button>
              <div id="appearanceOptions" class="appearance-options" role="menu" hidden>
                <button type="button" role="menuitemradio" data-theme-choice="system" aria-checked="true">System</button>
                <button type="button" role="menuitemradio" data-theme-choice="dark" aria-checked="false">Dark</button>
                <button type="button" role="menuitemradio" data-theme-choice="light" aria-checked="false">Light</button>
              </div>
            </div>
            <button id="openInspectorDesktopBtn" class="topbar-icon desktop-only status-button tool-icon" type="button" title="Runtime" aria-label="Open runtime panel">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10"></path>
                <path d="M18 7h2"></path>
                <circle cx="16" cy="7" r="2"></circle>
                <path d="M4 17h2"></path>
                <path d="M10 17h10"></path>
                <circle cx="8" cy="17" r="2"></circle>
              </svg>
            </button>
            <button id="openInspectorBtn" class="topbar-icon mobile-only status-button tool-icon" type="button" title="Runtime" aria-label="Open runtime panel">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10"></path>
                <path d="M18 7h2"></path>
                <circle cx="16" cy="7" r="2"></circle>
                <path d="M4 17h2"></path>
                <path d="M10 17h10"></path>
                <circle cx="8" cy="17" r="2"></circle>
              </svg>
            </button>
          </div>
        </header>

        <section id="messages" class="messages"></section>

        <form id="composer" class="composer">
          <input id="attachmentInput" class="attachment-input" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,application/pdf" />
          <div id="attachmentList" class="attachment-list" hidden></div>
          <button type="button" class="composer-tool" title="Attach" aria-label="Attach"></button>
          <textarea id="prompt" rows="1" placeholder="有问题，尽管问"></textarea>
          <button id="voiceMicBtn" type="button" class="composer-tool composer-mic" title="语音模式" aria-label="语音模式">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" class="icon" aria-hidden="true" fill="currentColor">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"></path>
              <path d="M6 11a1 1 0 1 1 2 0 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.91V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-3.09A6 6 0 0 1 6 11Z"></path>
            </svg>
          </button>
          <button id="sendBtn" type="submit" title="Send" aria-label="Send"></button>
        </form>
      </main>

      <aside id="inspectorDrawer" class="inspector drawer-panel" aria-label="Activity and runtime information" aria-hidden="true">
        <div class="inspector-header">
          <button id="closeInspectorBtn" class="icon-btn" title="Close activity" aria-label="Close activity">×</button>
        </div>
        <section class="panel activity-panel">
          <h2><span id="activityTitle">Activity</span> <span id="activityMeta"></span></h2>
          <div id="activityList" class="activity-list">
            <div class="activity-empty">No activity</div>
          </div>
        </section>
        <section class="panel runtime-panel">
          <h2>Runtime</h2>
          <div id="runtimeInfo" class="runtime-info"></div>
        </section>
      </aside>
    </div>

    <!-- 全屏语音免提层（与聊天共享同一 ws / session / runtime） -->
    <div id="voiceOverlay" class="voice-overlay" hidden>
      <div class="voice-stage-head">
        <button id="voiceExitBtn" class="voice-exit" type="button" aria-label="退出语音">✕</button>
        <span class="voice-stage-title">语音 · 同会话</span>
        <select id="voiceVoice" class="voice-voice-select" aria-label="播报声音" title="播报声音">
          <option value="">🔊 系统默认</option>
        </select>
      </div>
      <div class="voice-stage">
        <button id="voiceCircle" class="voice-circle off" type="button" aria-label="开始或暂停语音">
          <span class="voice-emoji">🎙️</span>
          <span class="voice-circle-label">点击开始</span>
        </button>
        <div id="voiceStatus" class="voice-status">点击麦克风，开始连续语音对话</div>
        <div id="voiceUnsupported" class="voice-unsupported" hidden></div>
      </div>
      <div id="voiceCaptions" class="voice-captions"></div>
      <div class="voice-footer">
        <select id="voiceThinkLevel" aria-label="思考等级">
          <option value="off">🧠 关</option>
        </select>
        <select id="voiceEngine" aria-label="语音识别引擎" title="语音识别引擎">
          <option value="webspeech">🎤 本地</option>
          <option value="aliyun">☁️ 阿里云</option>
        </select>
        <select id="voiceTtsVoice" aria-label="合成音色" title="合成音色">
          <option value="local">🔊 本地</option>
        </select>
      </div>
    </div>

    <div id="tokenDialog" class="token-dialog hidden">
      <div class="token-box">
        <h2>Access token</h2>
        <p>Enter the optional token passed to <code>nano-openclaw web --token</code>.</p>
        <input id="tokenInput" type="password" autocomplete="current-password" />
        <button id="tokenSave">Connect</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="/static/app.js?v=20260603-restful1"></script>
    <script src="/static/voice-utterance.js?v=20260603-restful1"></script>
    <script src="/static/voice-watchdog.js?v=20260603-restful1"></script>
    <script src="/static/voice-asr-aliyun.js?v=20260603-restful1"></script>
    <script src="/static/voice-engine.js?v=20260603-restful1"></script>
    <script src="/static/voice-pcm-player.js?v=20260603-restful1"></script>
    <script src="/static/voice-tts-aliyun.js?v=20260603-restful1"></script>
    <script src="/static/voice-tts-restful.js?v=20260603-restful1"></script>
    <script src="/static/voice-tap.js?v=20260603-restful1"></script>
    <script src="/static/voice-mode.js?v=20260603-restful1"></script>
  </body>
</html>
