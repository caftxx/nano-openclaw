<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0e14" />
  <title>nano-openclaw · 语音</title>
  <style>
    :root {
      --bg: #0b0e14;
      --fg: #e6e6e6;
      --dim: #8b95a7;
      --accent: #4ea1ff;
      --listen: #2ecc71;
      --think: #f1c40f;
      --speak: #4ea1ff;
      --error: #e74c3c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    header {
      padding: 14px 16px; font-size: 14px; color: var(--dim);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #1c2230;
    }
    #conn { font-size: 12px; }
    #conn.ok { color: var(--listen); }
    #conn.bad { color: var(--error); }

    main {
      flex: 1; display: flex; flex-direction: column;
      min-height: 0; padding: 12px; gap: 12px;
    }

    /* 圆 + 状态文字 —— 只在「字幕区以上」的空间里居中，
       这样无论会话多长，圆都不会越过顶栏。*/
    #stage {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }

    /* 大圆按钮：响应式尺寸，按视口短边缩放并封顶，避免顶到状态栏 */
    #mic {
      width: clamp(140px, 38vmin, 200px);
      height: clamp(140px, 38vmin, 200px);
      border-radius: 50%;
      flex: none;                 /* 关键：不被字幕区挤压，始终保持正圆 */
      aspect-ratio: 1 / 1;        /* 双保险：高度永远等于宽度 */
      border: none; cursor: pointer; position: relative;
      background: #161c28; color: var(--fg);
      font-size: 20px; font-weight: 600; letter-spacing: 1px;
      transition: transform .12s, box-shadow .25s, background .25s;
      box-shadow: 0 0 0 0 rgba(78,161,255,0);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    }
    #mic:active { transform: scale(.97); }
    #mic .emoji { font-size: clamp(40px, 11vmin, 56px); line-height: 1; }
    #mic.off    { background: #161c28; }
    #mic.listening { background: #14301f; box-shadow: 0 0 0 8px rgba(46,204,113,.18), 0 0 60px rgba(46,204,113,.35); animation: pulse 1.6s ease-in-out infinite; }
    #mic.thinking  { background: #322c12; box-shadow: 0 0 0 8px rgba(241,196,15,.18); }
    #mic.speaking  { background: #122438; box-shadow: 0 0 0 8px rgba(78,161,255,.20), 0 0 60px rgba(78,161,255,.35); }
    #mic.error     { background: #311616; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 8px rgba(46,204,113,.18), 0 0 50px rgba(46,204,113,.30); }
      50%     { box-shadow: 0 0 0 18px rgba(46,204,113,.06), 0 0 70px rgba(46,204,113,.45); }
    }

    #status { font-size: 15px; color: var(--dim); min-height: 20px; text-align: center; }

    /* 字幕区 */
    #captions {
      width: 100%; max-width: 640px; flex: 0 0 auto;
      max-height: 38vh; overflow-y: auto; padding: 0 4px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble {
      padding: 10px 14px; border-radius: 14px; font-size: 16px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word; max-width: 100%;
    }
    .bubble.you { align-self: flex-end; background: #1f3a56; border-bottom-right-radius: 4px; }
    .bubble.ai  { align-self: flex-start; background: #1a2130; border-bottom-left-radius: 4px; }
    .bubble.interim { opacity: .55; font-style: italic; }

    footer {
      padding: 10px 12px 18px; display: flex; gap: 8px;
      border-top: 1px solid #1c2230;
    }
    /* 三个控件等宽、单行、外观统一 */
    footer > button, footer > select {
      flex: 1 1 0; min-width: 0; height: 46px;
      background: #1a2130; color: var(--fg); border: 1px solid #283042;
      border-radius: 10px; padding: 0 6px; font-size: 14px; cursor: pointer;
      font-family: inherit; text-align: center; text-align-last: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      -webkit-appearance: none; appearance: none;
    }
    footer > button:active { background: #232c3e; }
    #thinkLevel.on { background: #322c12; border-color: #6b5a1e; color: #f1c40f; }
    .hidden { display: none !important; }

    #unsupported {
      padding: 24px; text-align: center; color: var(--error); font-size: 16px; line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <span>🚗 nano-openclaw 语音</span>
    <span id="conn" class="bad">未连接</span>
  </header>

  <main>
    <div id="stage">
      <button id="mic" class="off" aria-label="开始语音对话">
        <span class="emoji">🎙️</span>
        <span id="micLabel">点击开始</span>
      </button>
      <div id="status">点击麦克风，开始连续语音对话</div>
      <div id="unsupported" class="hidden">
        当前浏览器不支持语音识别。<br>请用 <b>Android Chrome</b> 打开本页面。
      </div>
    </div>
    <div id="captions"></div>
  </main>

  <footer>
    <select id="thinkLevel" aria-label="思考等级">
      <option value="off">🧠 关</option>
      <option value="minimal">🧠 极简</option>
      <option value="low">🧠 低</option>
      <option value="medium">🧠 中</option>
      <option value="high">🧠 高</option>
      <option value="xhigh">🧠 超高</option>
      <option value="adaptive">🧠 自适应</option>
      <option value="max">🧠 最大</option>
    </select>
    <button id="stopSpeak">⏹ 停止朗读</button>
    <button id="newSession">🆕 新会话</button>
  </footer>

  <script src="/static/voice.js"></script>
</body>
</html>
